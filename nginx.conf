server {
    listen 80;
    server_name _;

    # Front feed (Webcam21) at the container root.
    root /usr/share/nginx/html;
    index index.html;

    # Dogcam feed (Webcam22) served under /Webcam22/.
    # Mounted at /data/webcam22 to avoid creating a mountpoint inside the
    # read-only image root (nginx's /usr/share/nginx/html).
    location /Webcam22/ {
        alias /data/webcam22/;
        try_files $uri $uri/ /Webcam22/index.html;
        index index.html;
    }

    # Camera-scoped SPA routes. `/cameras/<id>/` serves that camera's
    # index.html *and* its static assets (lucide.min.js, thumbs/, images.json,
    # analysis.json, …), which the markup addresses as relative URLs.
    #
    # rewrite + root, not alias + try_files: with alias, $uri in try_files
    # still carries the location prefix, so nginx looks for
    # /usr/share/nginx/html/cameras/front/lucide.min.js and falls through to
    # the SPA fallback — every asset 404s as HTML. Rewriting the prefix off
    # first and using root means the file is looked up under the camera's
    # own directory.
    location /cameras/Webcam21/ {
        rewrite ^/cameras/Webcam21/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
    location /cameras/Webcam22/ {
        rewrite ^/cameras/Webcam22/(.*)$ /$1 break;
        root /data/webcam22;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Deprecated ids — no longer served.
    location /cameras/front/ { return 404; }
    location /cameras/back/ { return 404; }

    # Everything else falls through to the front feed's static files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Needle natural-language search assets. Served via docker-compose
    # (./tools → /tools:ro). The module fails gracefully if the
    # ONNX model files are absent.
    location /tools/ {
        alias /tools/;
    }

    # API proxy to the host write API (port 8190) so the SPA can reach
    # /api/status, /api/health, /api/inference_log, etc. from the public
    # port 8180 without exposing the API port directly.
    location /api/ {
        proxy_pass http://172.18.0.1:8190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}