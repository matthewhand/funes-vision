server {
    listen 80;
    server_name _;

    # Front feed (Webcam21) at the container root.
    root /usr/share/nginx/html;
    index index.html;

    # Dogcam feed (Webcam22) served under /Webcam22/.
    # Mounted at /data/webcam22 to avoid creating a mountpoint inside the
    # read-only image root (nginx's /usr/share/nginx/html).
    location /Webcam22/ {
        alias /data/webcam22/;
        try_files $uri $uri/ /Webcam22/index.html;
        index index.html;
    }

    # Camera-scoped SPA routes. `/cameras/<id>/` serves that camera's
    # index.html *and* its static assets (lucide.min.js, thumbs/, images.json,
    # analysis.json, …), which the markup addresses as relative URLs.
    #
    # rewrite + root, not alias + try_files: with alias, $uri in try_files
    # still carries the location prefix, so nginx looks for
    # /usr/share/nginx/html/cameras/front/lucide.min.js and falls through to
    # the SPA fallback — every asset 404s as HTML. Rewriting the prefix off
    # first and using root means the file is looked up under the camera's
    # own directory.
    location /cameras/front/ {
        rewrite ^/cameras/front/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
    location /cameras/back/ {
        rewrite ^/cameras/back/(.*)$ /$1 break;
        root /data/webcam22;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Everything else falls through to the front feed's static files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}