x-common: &common-settings
  image: nginx
  restart: unless-stopped
  mem_limit: 128m

services:
  webcam:
    <<: *common-settings
    container_name: webcam
    volumes:
      - /mnt/models/Webcam21:/usr/share/nginx/html:ro
      - /mnt/models/Webcam22:/data/webcam22:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8180:80"

