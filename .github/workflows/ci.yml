name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # opencv-python links against libGL.so.1 and libglib-2.0.so.0; neither is
      # guaranteed on the runner image, so `import cv2` fails without them.
      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Node tests
        run: bash tests/run.sh

  # The headless-browser a11y / visual regression gate. Deliberately a SEPARATE
  # job: it downloads a ~170MB browser and takes ~30s, and a flake here must
  # never block the fast Python/Node suites above. It runs against the
  # SYNTHETIC fixture gallery (tools/screenshots/proxy.py); the audit refuses to
  # start if the fixtures root resolves under /mnt/models, so it can never
  # touch a live camera path.
  browser-a11y-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Playwright pin lives in requirements-dev.txt (a comment, because it
      # is a Node package and the repo has no package.json). tests/
      # test_a11y_audit_gate.js asserts the workflow installs exactly that
      # version, so the pin cannot drift from the tested one.
      - name: Resolve the pinned Playwright version
        id: pw
        run: |
          version="$(grep -oE '^# ?playwright==[0-9.]+' requirements-dev.txt | sed 's/.*playwright==//')"
          test -n "$version" || { echo "::error::no playwright pin in requirements-dev.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Chromium is ~170MB; cache it on the version, not on run, so a rerun is
      # fast. Bump the key when the pin above moves.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      - name: Install Playwright (pinned) and Chromium
        run: |
          npm install --no-save --no-package-lock "playwright@${{ steps.pw.outputs.version }}"
          npx playwright install --with-deps chromium

      # Proves the gate is not vacuous before it is allowed to gate anything:
      # a seeded page (6px target, 3.45:1 text, 2000px block, <img> with no alt,
      # a refused request, an uncaught exception) MUST fail, a clean page MUST
      # pass, and the 0.001ms reduced-motion override the app ships MUST pass
      # while a 700ms spin MUST fail.
      - name: Self-check the audit (non-vacuity proof)
        run: node tools/screenshots/a11y_audit.js --selfcheck

      - name: Start the fixture stub
        run: |
          python3 tools/screenshots/proxy.py &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8899/api/health > /dev/null; then echo "stub up"; exit 0; fi
            sleep 0.5
          done
          echo "::error::the fixture stub never came up on :8899"; exit 1

      - name: Audit the fixture gallery
        env:
          A11Y_AUDIT_JSON: ${{ github.workspace }}/a11y-report.json
        run: node tools/screenshots/a11y_audit.js

      - name: Verify responsive light/dark/system themes
        run: node tools/screenshots/theme_smoke.js

      - name: Verify desktop/mobile archive calendar
        run: node tools/screenshots/calendar_smoke.js

      - name: Verify gallery layout and mobile sheets across viewports
        run: node tools/screenshots/layout_regression_smoke.js

      - name: Verify gallery without Ollama inference
        run: node tools/screenshots/offline_inference_smoke.js

      - name: Verify degraded-inference fixture (offline status fixture + 503 health)
        run: |
          SCREENSHOT_PORT=8898 SCREENSHOT_API_DIR="$PWD/tools/screenshots/fixtures/api-offline" SCREENSHOT_HEALTH_STATUS=503 python3 tools/screenshots/proxy.py &
          stub=$!
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8898/api/health || echo 000)
            if [ "$code" = "503" ]; then break; fi
            sleep 0.5
          done
          [ "$code" = "503" ] || { echo "::error::offline stub never answered 503 on :8898"; kill $stub; exit 1; }
          rc=0
          OFFLINE_SMOKE_URL=http://127.0.0.1:8898/ SCREENSHOT_OUT=offline-previews/degraded node tools/screenshots/offline_inference_degraded_smoke.js || rc=$?
          kill $stub
          exit $rc

      - name: Upload synthetic Ollama-off previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-off-previews
          path: offline-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload synthetic layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-previews
          path: layout-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify multi-year calendar and keyboard focus
        run: node tools/screenshots/calendar_navigation_smoke.js

      - name: Upload synthetic calendar previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-previews
          path: calendar-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload synthetic theme previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: theme-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-audit-report
          path: a11y-report.json
          if-no-files-found: ignore
          retention-days: 14
